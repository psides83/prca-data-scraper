name: PRCA rodeo schedule sync

on:
  schedule:
    - cron: "15 12 * * 1,4"
  workflow_dispatch:
    inputs:
      schedule_year:
        description: "Schedule year to sync"
        required: false
        default: "2026"
      schedule_start_date:
        description: "Schedule start date, such as 1/1/2026"
        required: false
        default: "1/1/2026"
      schedule_end_date:
        description: "Schedule end date, such as 9/30/2026"
        required: false
        default: "9/30/2026"

concurrency:
  group: prca-schedules-twice-weekly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRCA_API_BASE: https://d1kfpvgfupbmyo.cloudfront.net/services/pro_rodeo.ashx
      SCHEDULE_YEAR: ${{ github.event.inputs.schedule_year || '2026' }}
      SCHEDULE_START_DATE: ${{ github.event.inputs.schedule_start_date || '1/1/2026' }}
      SCHEDULE_END_DATE: ${{ github.event.inputs.schedule_end_date || '9/30/2026' }}
      SCHEDULE_PAGE_SIZE: "2000"
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
      GEOCODE_RETRY_FAILED: "true"
      GEOCODE_DELAY_MS: "200"
      GEOCODE_JITTER_MS: "200"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required."
            exit 1
          fi

      - name: Initialize schema
        run: npm run db:init

      - name: Sync rodeo schedules
        run: npm run schedules:sync

      - name: Geocode missing rodeo venues
        if: ${{ env.GOOGLE_PLACES_API_KEY != '' || env.GOOGLE_GEOCODING_API_KEY != '' }}
        run: npm run venues:geocode
